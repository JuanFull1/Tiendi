<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Clientes - Tiendi</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <link rel="stylesheet" href="../css/styles.css">
</head>

<body>

    <aside id="sidebar"></aside>

    <div class="main-wrapper">

        <header id="topbar"></header>

        <main class="content">

            <!-- Encabezado de página -->
            <div class="page-header d-flex justify-content-between align-items-center">

                <div>
                    <h2>Clientes</h2>

                    <p class="text-muted mb-0">
                        Administración de clientes del negocio.
                    </p>
                </div>

                <button
                    type="button"
                    class="btn btn-primary"
                    id="btn-nuevo"
                >
                    <i class="bi bi-plus-lg me-1"></i>
                    Crear cliente
                </button>

            </div>

            <!-- Barra de búsqueda -->
            <div class="mb-4">
                <div class="input-group" style="max-width: 480px;">
                    <span class="input-group-text bg-white border-end-0 rounded-start-3">
                        <i class="bi bi-search text-muted"></i>
                    </span>

                    <input
                        type="text"
                        id="buscar"
                        class="form-control border-start-0 rounded-end-3"
                        placeholder="Buscar clientes"
                    >
                </div>
            </div>

            <!-- Tarjetas de resumen -->
            <div class="row g-3 mb-4">

                <div class="col-md-6">
                    <div class="card module-card h-100">
                        <div class="card-body d-flex align-items-center gap-3">

                            <div class="fs-3 text-primary">
                                <i class="bi bi-people"></i>
                            </div>

                            <div>
                                <div class="text-muted small">
                                    Total de clientes
                                </div>

                                <div
                                    class="fs-4 fw-semibold"
                                    id="total-clientes"
                                >
                                    —
                                </div>
                            </div>

                        </div>
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="card module-card h-100">
                        <div class="card-body d-flex align-items-center gap-3">

                            <div class="fs-3 text-success">
                                <i class="bi bi-cash-coin"></i>
                            </div>

                            <div>
                                <div class="text-muted small">
                                    Total por cobrar
                                </div>

                                <div
                                    class="fs-4 fw-semibold"
                                    id="total-por-cobrar"
                                >
                                    —
                                </div>
                            </div>

                        </div>
                    </div>
                </div>

            </div>

            <!-- Tabla de clientes -->
            <div class="card module-card">

                <div class="card-body p-0">

                    <table class="table table-hover align-middle mb-0">

                        <thead>
                            <tr>
                                <th>Nombre</th>
                                <th>Teléfono</th>
                                <th>Documento</th>
                                <th class="text-end">Total por cobrar</th>
                                <th class="text-center">Estado</th>
                                <th class="text-end">Acciones</th>
                            </tr>
                        </thead>

                        <tbody id="tabla-clientes">
                            <tr>
                                <td colspan="6" class="text-center text-muted py-4">
                                    Cargando clientes...
                                </td>
                            </tr>
                        </tbody>

                    </table>

                </div>

            </div>

        </main>

    </div>

    <!-- Modal crear/editar -->
    <div class="modal fade" id="modalCliente" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitulo">Nuevo cliente</h5>
                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                    ></button>
                </div>

                <div class="modal-body">

                    <form id="form-cliente">

                        <input type="hidden" id="cliente-id">

                        <div class="mb-3">
                            <label class="form-label">Nombre *</label>
                            <input
                                type="text"
                                class="form-control"
                                id="nombre"
                                maxlength="100"
                            >
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Apellido</label>
                            <input
                                type="text"
                                class="form-control"
                                id="apellido"
                                maxlength="100"
                            >
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Identificación</label>
                            <input
                                type="text"
                                class="form-control"
                                id="identificacion"
                                maxlength="20"
                            >
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Teléfono</label>
                            <input
                                type="text"
                                class="form-control"
                                id="telefono"
                                maxlength="20"
                            >
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input
                                type="email"
                                class="form-control"
                                id="email"
                                maxlength="150"
                            >
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Dirección</label>
                            <input
                                type="text"
                                class="form-control"
                                id="direccion"
                                maxlength="250"
                            >
                        </div>

                    </form>

                </div>

                <div class="modal-footer">
                    <button
                        type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal"
                    >
                        Cancelar
                    </button>

                    <button
                        type="button"
                        class="btn btn-primary"
                        id="btn-guardar"
                    >
                        Guardar
                    </button>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/services/auth.js"></script>
    <script src="../js/services/api.js"></script>
    <script src="../js/shared/layout.js"></script>
    <script src="../js/modules/clientes.js"></script>

</body>

</html>
