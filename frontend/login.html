<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Iniciar sesión | Tiendi</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="css/styles.css"
    >

</head>

<body class="login-body">

    <main class="login-container">

        <div class="card login-card">

            <div class="card-body p-4">

                <div class="text-center mb-4">

                    <h2 class="fw-bold">
                        TIENDI
                    </h2>

                    <p class="text-muted mb-0">
                        Sistema de inventario y ventas
                    </p>

                </div>

                <form id="login-form">

                    <div class="mb-3">

                        <label
                            for="email"
                            class="form-label"
                        >
                            Correo electrónico
                        </label>

                        <input
                            type="email"
                            id="email"
                            class="form-control"
                            autocomplete="username"
                            required
                        >

                    </div>

                    <div class="mb-3">

                        <label
                            for="password"
                            class="form-label"
                        >
                            Contraseña
                        </label>

                        <input
                            type="password"
                            id="password"
                            class="form-control"
                            autocomplete="current-password"
                            required
                        >

                    </div>

                    <div
                        id="login-message"
                        class="text-danger small mb-3"
                    ></div>

                    <button
                        id="login-button"
                        type="submit"
                        class="btn btn-primary w-100"
                    >
                        Ingresar
                    </button>

                </form>

            </div>

        </div>

    </main>

    <script src="js/services/api.js"></script>
    <script src="js/login.js"></script>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
